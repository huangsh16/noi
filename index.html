<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的产品</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header>
        <div class="container">
            <h1>我的产品名称</h1>
            <nav>
                <a href="#product">产品介绍</a>
                <a href="#contact">联系我们</a>
            </nav>
        </div>
    </header>

    <!-- 产品介绍 -->
    <section id="product" class="section">
        <div class="container">
            <h2>产品介绍</h2>
            <div class="product-content">
                <img src="images/product.jpg" alt="产品图片">
                <p>这里是产品介绍文字，可以描述功能、特点和优势。让用户快速了解你的产品价值。</p>
            </div>
        </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact" class="section">
        <div class="container">
            <h2>联系我们</h2>
            <p>电话: 12345678</p>
            <p>邮箱: example@example.com</p>
            <p>地址: 某某城市，某某街道</p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 我的产品. 保留所有权利。</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
